<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GigPredictor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* Google Places Autocomplete — dark theme */
      .pac-container {
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        margin-top: 4px;
        overflow: hidden;
        font-family: Inter, Arial, sans-serif;
      }
      .pac-item {
        padding: 10px 16px;
        color: #cbd5e1;
        border-top: 1px solid rgba(148, 163, 184, 0.1);
        cursor: pointer;
        font-size: 0.875rem;
        line-height: 1.4;
      }
      .pac-item:first-child { border-top: none; }
      .pac-item:hover,
      .pac-item-selected { background: rgba(56, 189, 248, 0.12); }
      .pac-item-query {
        color: #38bdf8;
        font-size: 0.875rem;
      }
      .pac-matched { color: #7dd3fc; font-weight: 600; }
      .pac-icon { display: none; }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
